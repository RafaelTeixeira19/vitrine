<style>
/* Layout: a racing-red bonnet with two white stripes (brand, five main tabs, price source), a white bar of
   sub-tabs under it, then light panels: grids of cards, rows of "info + 3 charts", tables. One deliberate light
   look chosen by the user (2026-10-29): white bodywork, red paint, rises in navy, falls in deep violet. */
:root {
  color-scheme: light;
  --bg: #f5f3f2;          /* page: white with a faint warm bias toward the red */
  --surface: #ffffff;     /* panels, chart area, cards */
  --sunk: #f7f4f3;        /* panels inside panels (chart wells, tiles) */
  --raised: #efe9e8;      /* chips, hover */
  --line: #e6dedd;
  --grid: #efe9e8;
  --ink: #1b1719;
  --ink-2: #4c4446;
  --muted: #7d7274;
  --red: #c8102e;         /* rosso corsa: brand, active controls, price line */
  --red-deep: #9c0c24;
  --red-ink: #ffffff;
  --stripe: #ffffff;
  --price: #c8102e;
  --price-soft: rgba(200, 16, 46, 0.14);
  --price-none: rgba(200, 16, 46, 0);
  --steam-line: #9a8f91;  /* Steam part of a spliced curve (before CSFloat's history starts) */
  --vol: rgba(125, 114, 116, 0.32);
  --up: #1f5fd1;          /* rises: bright blue (2026-10-30: navy and violet were too close to tell apart) */
  --up-soft: #e8f0fc;
  --down: #b45309;        /* falls: amber (blue / amber: delta E 32, 28 for colour-blind readers) */
  --down-soft: #fdf1e4;
  --warn: #9c0c24;        /* warnings in deep red, so that none looks like a fall */
  --warn-soft: #fbe8eb;
  --total: #1b1719;       /* total line of the Indices */
  --member: #d3c9ca;      /* thin lines of the members */
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6;
  --font-ui: "Nunito", "Segoe UI", Arial, Helvetica, sans-serif;            /* body, tabular figures */
  --font-display: "Saira Semi Condensed", "Arial Narrow", Arial, sans-serif; /* brand, tabs, headings */
  --r: 4px;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--red); }
a { color: var(--red); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.num, .last, .pill, .v, td { font-variant-numeric: tabular-nums; }
h1, h2, h3 { text-wrap: balance; }

/* header: red bonnet with two white racing stripes along its lower edge */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; box-shadow: 0 2px 10px rgba(60, 10, 20, 0.12); }
.bonnet { background: var(--red); color: var(--red-ink);
  background-image: linear-gradient(to bottom, transparent calc(100% - 13px), var(--stripe) calc(100% - 13px), var(--stripe) calc(100% - 9px), transparent calc(100% - 9px), transparent calc(100% - 6px), var(--stripe) calc(100% - 6px), var(--stripe) calc(100% - 2px), transparent calc(100% - 2px)); }
.wrap { max-width: 1560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding-block: 12px 22px; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand h1 { margin: 0; font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 25px; line-height: 1.05; letter-spacing: 0.02em; text-transform: uppercase; }
.stamp { font-size: 12px; opacity: 0.88; }
.sections { display: flex; flex-wrap: wrap; gap: 2px; }
.sections button { border: 0; background: transparent; color: var(--red-ink); padding: 6px 14px; border-radius: 2px; cursor: pointer; font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.82; }
.sections button:hover { opacity: 1; background: rgba(255, 255, 255, 0.12); }
.sections button[aria-selected="true"] { opacity: 1; background: var(--stripe); color: var(--red); }
.srcsw { display: flex; gap: 2px; margin-left: auto; background: rgba(0, 0, 0, 0.16); border-radius: var(--r); padding: 2px; }
.srcsw button { border: 0; background: transparent; color: var(--red-ink); padding: 5px 11px; border-radius: 2px; cursor: pointer; font-size: 13px; font-weight: 700; }
.srcsw button[aria-pressed="true"] { background: var(--stripe); color: var(--red); }
.subbar { background: var(--surface); border-bottom: 1px solid var(--line); }
.subbar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; flex: 1 1 auto; min-width: 0; }
.tabs button { border: 0; background: transparent; padding: 10px 13px 9px; cursor: pointer; color: var(--ink-2); font-size: 14px; font-weight: 600; white-space: nowrap; border-bottom: 3px solid transparent; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--red); border-bottom-color: var(--red); }
.tabs .gear { margin-left: auto; }
.seg { display: flex; flex-wrap: wrap; gap: 2px; background: var(--sunk); border: 1px solid var(--line); border-radius: var(--r); padding: 2px; margin-block: 5px; }
.seg button { border: 0; background: transparent; padding: 4px 10px; border-radius: 2px; cursor: pointer; color: var(--ink-2); font-size: 12.5px; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--red); color: var(--red-ink); }
.seg button:disabled { opacity: 0.35; cursor: default; }
.seg .s { display: none; }
.alert { margin-top: 14px; padding: 10px 14px; border-radius: var(--r); background: var(--warn-soft); color: var(--warn); border-left: 3px solid var(--warn); }

/* toolbar */
main { padding-block: 18px 48px; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 14px; }
.tools .count { color: var(--muted); }
.tools label { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); }
select, input[type="text"], input[type="number"], input[type="date"] { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 10px; color: var(--ink); }
select { cursor: pointer; }
input[type="text"]::placeholder { color: var(--muted); font-style: italic; }

/* shared pieces */
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.chip { font-size: 11px; letter-spacing: 0.03em; color: var(--ink-2); background: var(--raised); border-radius: 2px; padding: 1px 6px; }
.chip.err { color: var(--warn); background: var(--warn-soft); }
.last { font-size: 22px; font-weight: 800; color: var(--ink); }
.pill { font-size: 12.5px; font-weight: 700; padding: 2px 7px; border-radius: 2px; white-space: nowrap; }
.pill.up { color: var(--up); background: var(--up-soft); }
.pill.down { color: var(--down); background: var(--down-soft); }
.pill.flat { color: var(--ink-2); background: var(--raised); }
.up { color: var(--up); }
.down { color: var(--down); }
/* key figures that rise or fall carry the arrow too, so the direction never rests on colour alone */
.stat .v.up::before { content: "▲ "; font-size: 0.7em; vertical-align: 0.12em; }
.stat .v.down::before { content: "▼ "; font-size: 0.7em; vertical-align: 0.12em; }
.since { color: var(--muted); font-size: 12px; }
.chart { position: relative; height: 210px; min-width: 0; }
.legend { position: absolute; left: 6px; top: 2px; z-index: 2; font-size: 11.5px; color: var(--ink); background: rgba(255, 255, 255, 0.92); border: 1px solid var(--line); padding: 1px 6px; border-radius: 2px; pointer-events: none; max-width: calc(100% - 12px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini { display: flex; flex-wrap: wrap; gap: 2px; }
.mini button { border: 0; background: transparent; padding: 3px 7px; border-radius: 2px; cursor: pointer; color: var(--muted); font-size: 12px; }
.mini button:hover { color: var(--ink); background: var(--raised); }
.mini button[aria-pressed="true"] { color: var(--red-ink); background: var(--red); }
.mini button:disabled { opacity: 0.35; cursor: default; background: transparent; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 128px), 1fr)); gap: 10px 14px; margin: 0; }
.stat { min-width: 0; display: flex; flex-direction: column; gap: 1px; }

  studies: {},                         // study files by name (null while read, false when missing)
  sample: undefined, sampleTools: false, // Méta-analyse chat: Claude's `sample` (undefined while asked, null when absent)
  chatDb: null, chatDocs: null, chat: null,

function validSlots(v, def = ["J", "M", "MAX"]) {

let slotPanels = [];   // painted panels of the current view, per slot, so a horizon change updates the whole column
const charts = [];

function store(k, v) {

const $ = (sel, root = document) => root.querySelector(sel);

/* ---------- formatting (French, Paris time) ---------- */
const nf2 = new Intl.NumberFormat("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const int = v => v === null || v === undefined ? "n.d." : nfInt.format(v);
const nf1 = new Intl.NumberFormat("fr-FR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
// every price of the station is in US dollars, the dollar sign before the number ($0,085, $12,40)
const usdTxt = v => v === null || v === undefined || !isFinite(v) ? "n.d." : (v < 0 ? "-$" : "$") + (Math.abs(v) < 0.1 ? nf3 : nf2).format(Math.abs(v));
const amt = v => usdTxt(v);
const TZ = "Europe/Paris";
const fDate = new Intl.DateTimeFormat("fr-FR", { timeZone: "UTC", day: "numeric", month: "short", year: "numeric" });
const fDateTime = new Intl.DateTimeFormat("fr-FR", { timeZone: TZ, day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

const fTick = {
  year: new Intl.DateTimeFormat("fr-FR", { timeZone: "UTC", year: "numeric" }),
  month: new Intl.DateTimeFormat("fr-FR", { timeZone: "UTC", month: "short" }),
  day: new Intl.DateTimeFormat("fr-FR", { timeZone: "UTC", day: "numeric", month: "short" }),
  time: new Intl.DateTimeFormat("fr-FR", { timeZone: TZ, hour: "2-digit", minute: "2-digit" }),
};
const when = (t, hourly) => hourly || t % DAY ? fDateTime.format(new Date(t * 1000)) : fDate.format(new Date(t * 1000));
// links come from the database (written by any editor of the page): only Steam and csgoskins pages are followed
const safeUrl = u => typeof u === "string" && /^https:\/\/(steamcommunity\.com\/market\/listings\/730\/|csgoskins\.gg\/items\/)/.test(u) ? u : null;
// CSFloat listings of an item: built here from its market name (the search page's own `market_hash_name` filter)
function csfloatLink(p) {

/* ---------- data access ---------- */
function list() {
  if (S.products) {
    return [...S.products.entries()].map(([id, doc]) => ({ id, doc, rec: S.market[id] || null }));
  }
  return Object.keys(S.market).map(id => ({ id, doc: {}, rec: S.market[id] }));
}
const nameOf = p => (p.rec && p.rec.name) || p.doc.mhn || p.doc.code || p.id;
const catOf = p => p.doc.category || (p.rec && p.rec.category) || null;
const eventOf = p => p.doc.event || (p.rec && p.rec.event) || null;
function matches(p, filter) {
  const f = filter || { category: "all" };
  if (Array.isArray(f.ids)) return f.ids.includes(p.id);
  // watchlist products only show in tabs that ask for them, never in the category tabs
  if (f.category === "watch") return !!p.doc.watch;
  if (p.doc.watch) return false;
  return !f.category || f.category === "all" || catOf(p) === f.category;
}
function median(vals) {
  const v = vals.filter(x => x !== null && x !== undefined && isFinite(x)).sort((a, b) => a - b);
  if (!v.length) return null;
  const m = v.length >> 1;
  return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
}
function csfClean(d) {
  // a day whose average sits more than 5 times above the median of the days around it (15 days each side), on 3 sales
  // or fewer, is an isolated odd sale (3DMAX Shanghai 2024 sold once at $491,85 on 2026-09-18): left out of the
  // CSFloat charts and changes, and counted next to the record
  const out = [], dropped = [];
  for (let i = 0; i < d.length; i++) {
    const [t, v, n] = d[i];
    const near = [];
    let after = 0;
    for (let j = i - 1; j >= 0 && d[j][0] >= t - 15 * DAY; j--) near.push(d[j][1]);
    for (let j = i + 1; j < d.length && d[j][0] <= t + 15 * DAY; j++) { near.push(d[j][1]); after++; }
    // a day with no later day around it is kept: a fresh rise must show before the next days confirm it

}
const srcCache = new WeakMap();
function recOf(p, src = S.src) {
  // the record to show for the page's source. Steam: data.json as is (dollars, hourly tail of ~30 days).
  // CSFloat: its daily sale averages from its first day (2023-06-15 at the earliest), Steam's days before it
  // (`split` = first CSFloat day, drawn as a change of colour); ask = CSFloat's lowest listing.
  const r = p && p.rec;
  if (!r || src !== "csfloat") return r;
  if (srcCache.has(r)) return srcCache.get(r);
  const d = Array.isArray(r.csf_daily) ? r.csf_daily : [];
  let out = null;
  if (d.length) {
    const clean = csfClean(d);
    const dd = clean.out.length ? clean.out : d;
    const split = dd[0][0];
    const daily = (r.daily || []).filter(q => q[0] < split).concat(dd);
    const last = dd[dd.length - 1];
    const ath = daily.reduce((m, q) => (q[1] > m[1] ? q : m), daily[0]);
    out = Object.assign({}, r, { csf: true, split, daily, hourly: [], last: last[1], last_t: last[0], dropped: clean.dropped.length,
      ath: [ath[0], ath[1]], ask: r.csf_ask === undefined ? null : r.csf_ask, n_ask: r.csf_n_ask === undefined ? null : r.csf_n_ask,
      bid: null, n_bid: null, lastN: last[2] });
  }

}
const isHourlyOff = h => S.src === "csfloat" && h.hourly;   // CSFloat has one price a day: no Jour / Hebdo view
function windowPts(rec, hk) {
  const h = HZ_BY[hk];
  const src = h.hourly && rec.hourly && rec.hourly.length ? rec.hourly : rec.daily;
  if (!src || !src.length) return [];
  const end = src[src.length - 1][0];
  const start = end - h.d * DAY;
  return src.filter(p => p[0] > start);
}
function stats(rec, hk) {
  const pts = windowPts(rec, hk);
  if (!pts.length) return null;
  const h = HZ_BY[hk];
  const first = pts[0][1];
  let hi = pts[0], lo = pts[0], vol = 0;
  for (const p of pts) { if (p[1] > hi[1]) hi = p; if (p[1] < lo[1]) lo = p; vol += p[2]; }
  const ageDays = Math.max(1, (rec.last_t - (rec.first || pts[0][0])) / DAY + 1);
  const spanDays = Math.min(h.d, ageDays);
  const cut = rec.last_t - DAY;
  const vol24 = rec.csf ? rec.lastN : (rec.hourly || []).filter(p => p[0] > cut).reduce((a, p) => a + p[2], 0);
  const partial = ageDays < h.d;

/* ---------- charts ---------- */
function makeChart(container, legendEl, rec, hk, bgVar = "--surface") {
  const css = getComputedStyle(document.documentElement);
  const c = name => css.getPropertyValue(name).trim();
  const h = HZ_BY[hk];
  let hourly = !!h.hourly;
  const chart = LWC.createChart(container, {
    autoSize: true,
    layout: { background: { color: c(bgVar) }, textColor: c("--muted"), fontFamily: c("--font-ui"), fontSize: 11, attributionLogo: false, panes: { separatorColor: c("--line"), enableResize: false } },
    grid: { vertLines: { visible: false }, horzLines: { color: c("--grid") } },
    rightPriceScale: { borderVisible: false, scaleMargins: { top: 0.12, bottom: 0.06 } },
    timeScale: { borderVisible: false, timeVisible: !!h.hourly, secondsVisible: false, fixLeftEdge: true, fixRightEdge: true, lockVisibleTimeRangeOnResize: true,
      tickMarkFormatter: (t, type) => {
        const d = new Date(t * 1000);
        return type === 0 ? fTick.year.format(d) : type === 1 ? fTick.month.format(d) : type === 2 ? fTick.day.format(d) : fTick.time.format(d);
      } },
    crosshair: { mode: 1, vertLine: { color: c("--muted"), style: 2, labelVisible: false }, horzLine: { color: c("--muted"), style: 2 } },
    localization: { locale: "fr-FR", timeFormatter: t => when(t, hourly) },  // each series formats its own axis
    handleScroll: false, handleScale: false,
  });

    return fillChart(chart, legendEl, rec, hk, c, () => hourly, v => { hourly = v; });
  } catch (e) {

}
function fillChart(chart, legendEl, rec, hk, c, isHourly, setHourly) {

  const pfmt = { type: "custom", formatter: v => (v < 0.1 ? nf3 : nf2).format(v), minMove: 0.001 };
  const before = rec.split ? chart.addSeries(LWC.LineSeries, { color: c("--steam-line"), lineWidth: 2, priceLineVisible: false,
    lastValueVisible: false, crosshairMarkerRadius: 3, priceFormat: pfmt }) : null;
  const price = chart.addSeries(LWC.AreaSeries, {
    lineColor: c("--price"), topColor: c("--price-soft"), bottomColor: c("--price-none"), lineWidth: 2,
    priceLineVisible: false, lastValueVisible: true, crosshairMarkerRadius: 4, priceFormat: pfmt,
  });
  const vol = chart.addSeries(LWC.HistogramSeries, { color: c("--vol"), priceFormat: { type: "custom", formatter: v => int(Math.round(v)), minMove: 1 }, priceLineVisible: false, lastValueVisible: false }, 1);
  chart.panes()[1].setStretchFactor(0.3);
  const resetLegend = () => { legendEl.textContent = ""; legendEl.hidden = true; };
  chart.subscribeCrosshairMove(param => {
    if (!param.time) return resetLegend();
    const p = param.seriesData.get(price) || (before && param.seriesData.get(before)), v = param.seriesData.get(vol);
    if (!p) return resetLegend();
    legendEl.hidden = false;
    const srcName = rec.split ? (param.time < rec.split ? " (Steam)" : " (CSFloat)") : "";
    legendEl.textContent = `${when(param.time, isHourly())} · ${amt(p.value)}${srcName} · ${int(v ? v.value : 0)} ventes`;
  });
  resetLegend();
  const api = {
    chart,
    set(hk2) {
      const pts = windowPts(rec, hk2);
      setHourly(!!HZ_BY[hk2].hourly && !!(rec.hourly && rec.hourly.length));
      chart.applyOptions({ timeScale: { timeVisible: isHourly() } });
      if (before) {
        // the first CSFloat point closes the grey line, so the curve has no gap at the junction
        const a = pts.filter(p => p[0] <= rec.split);
        before.setData(a.map(p => ({ time: p[0], value: p[1] })));
        price.setData(pts.filter(p => p[0] >= rec.split).map(p => ({ time: p[0], value: p[1] })));
      } else price.setData(pts.map(p => ({ time: p[0], value: p[1] })));

    },
  };

}
function clearCharts() {
  slotPanels = [];
  if (observer) observer.disconnect();
  observer = null;
  while (charts.length) { try { charts.pop().chart.remove(); } catch (e) { /* already gone */ } }
}

/* ---------- shared pieces ---------- */
function cell(label, value, sub) {
  return el("div", { class: "stat" }, el("span", { class: "k", text: label }), el("span", { class: "v", text: value }), sub ? el("span", { class: "s", text: sub }) : null);
}
function windowCells(st, hourly) {
  return [cell("Plus haut", amt(st.hi[1]), when(st.hi[0], hourly)), cell("Plus bas", amt(st.lo[1]), when(st.lo[0], hourly)), cell("Ventes / jour", int(st.avgVol), "en moyenne")];
}
function marketCells(rec, st) {
  const rec0 = rec.csf
    ? [cell("Plus basse annonce", amt(rec.ask), rec.n_ask !== null ? int(rec.n_ask) + " annonces CSFloat" : null)]
    : [cell("Offre (vente)", amt(rec.ask), rec.n_ask !== null ? int(rec.n_ask) + " annonces" : null),
      cell("Demande (achat)", amt(rec.bid), rec.n_bid !== null ? int(rec.n_bid) + " ordres" : null)];
  return [...rec0,
    cell("Record", amt(rec.ath[1]), fDate.format(new Date(rec.ath[0] * 1000))
      + (rec.dropped ? ` · ${rec.dropped} jour${rec.dropped > 1 ? "s" : ""} aberrant${rec.dropped > 1 ? "s" : ""} masqué${rec.dropped > 1 ? "s" : ""}` : "")),
    cell("Sortie", fDate.format(new Date(rec.first * 1000))),
    cell(rec.csf ? "Ventes du dernier jour" : "Ventes 24 h", int(st ? st.vol24 : null), rec.csf ? "CSFloat" : null),
  ];
}
function changeBits(st, k) {

  const arrow = dir === "up" ? "▲ " : dir === "down" ? "▼ " : "";
  return [el("span", { class: "pill " + dir, text: arrow + nfPct.format(st.change * 100) + " %", title: `Depuis ${amt(st.first)}` }),
    el("span", { class: "since", text: st.partial ? "depuis la sortie" : HZ_BY[k].l.toLowerCase() })];
}
function csfloatBuy(p) {

  return mhn ? el("a", { class: "buy", href: "https://csfloat.com/search?market_hash_name=" + encodeURIComponent(mhn), target: "_blank", rel: "noopener", text: "CSFloat ↗" }) : null;
}
function linkRow(rec, extra) {

}
function chipsOf(p) {

    catOf(p) && el("span", { class: "chip", text: CAT_ONE[catOf(p)] || catOf(p) }),
    eventOf(p) && el("span", { class: "chip", text: eventOf(p) }),
    S.src === "steam" && rec && rec.error && el("span", { class: "chip err", text: "Dernière mise à jour Steam en échec", title: rec.error }),
    S.src === "csfloat" && rec && !(rec.csf_daily && rec.csf_daily.length) && el("span", { class: "chip err", text: "Pas encore de prix CSFloat" }),
    S.src === "steam" && rec && rec.fetched && Date.now() / 1000 - rec.fetched > STALE_H * 3600 && el("span", { class: "chip err", text: "Prix du " + fDate.format(new Date(rec.fetched * 1000)) }));
}
function waitNote(p) {
  const err = p.doc.status === "error";

    ? `Steam n'a pas reconnu ce lien (${p.doc.error || "erreur inconnue"}). Vérifie-le dans Réglages.`

/* ---------- rows: info column + 3 charts (Événement, Objet) ---------- */
function row3(p, opts = {}) {
  const rec = recOf(p);
  const csf = S.src === "csfloat";
  const slots = csf ? S.slotsCsf : S.slots, slotsKey = csf ? "slotsCsf" : "slots";
  // a series without hourly points (CSFloat) shows the monthly view instead of Jour / Hebdo
  const fix = k => csf && HZ_BY[k].hourly ? "M" : k;
  const info = el("div", { class: "info" },
    opts.images && p.rec && p.rec.img && el("img", { src: p.rec.img, alt: "", width: 120, height: 120, loading: "lazy" }),
    el("div", { class: "title" }, el("h2", { text: nameOf(p) }), chipsOf(p)));

    node.append(el("div", { class: "wait-row" }, p.rec ? el("p", { class: "wait", text: "Pas encore de prix CSFloat pour cet objet : ils arrivent à la prochaine mise à jour, vers minuit. Bascule sur Steam pour voir son historique." }) : waitNote(p)));

    el("div", { class: "stats" }, ...marketCells(rec, st0)),

    const chartBox = el("div", { class: "chart" });
    const legend = el("div", { class: "legend", hidden: true });

// The Capsule Allocator's and the Team Sticker Allocator's reading (user, 2026-10-30): weight = price tilt x rank
// (Holo) x trend x scarcity, each factor exp(strength x score) within [1/3, 3]; by default the same money for every

  return items.map(it => {

    const p = px.p;
    let why = null;
    if (!p) why = "sans prix";

    else if (!s.avoid && ctx.ratings && ctx.ratings[it.fam] && ctx.ratings[it.fam][it.group] === "avoid") why = "noté Éviter";
    else if (!s.neutral && ctx.ratings && ctx.ratings[it.fam] && ctx.ratings[it.fam][it.group] === "hold") why = "noté Neutre";
    else if (s.age12 && it.release && ctx.now - it.release < 365 * DAY) why = "moins de 12 mois";

  requestAnimationFrame(() => { renderQueued = false; render(); });
}

async function loadMarket(refresh) {
  try {
    const r = await fetch("data.json", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    S.market = d.products || {}; S.updated = d.updated || null; S.errors = d.errors || [];
  } catch (e) {
    if (refresh) return false;   // a failed refresh keeps the prices already on screen
    S.market = {}; S.updated = null;
    $("#alert").hidden = false;
    $("#alert").textContent = "Impossible de lire les données de prix publiées avec la page.";
    S.loaded = true;
    return false;
  }
  S.loaded = true;
  return true;
}
async function loadAux(file, key) {
  // indices.json: a missing file only empties the Indices views
  try {
    const r = await fetch(file, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    S[key] = await r.json();
  } catch (e) { S[key] = false; }
  queueRender();
}
async function connectDb() {
  let db = null;
  try { db = await (window.claude && window.claude.use ? window.claude.use("db") : null); } catch (e) { db = null; }
  if (!db) { queueRender(); return; }
  // Méta-analyse chat: the conversations kept (read back from VS Code with ArtifactData list meta_chat)
  S.chatDb = db;
  db.collection("meta_chat").onSnapshot(snap => { S.chatDocs = new Map(snap.docs.map(d => [d.id, d.data()])); queueRender(); },
    () => { S.chatDocs = false; queueRender(); });
  // the page switches to the stored configuration only once both collections have answered;
  // if either subscription dies, the page falls back to the price file for the rest of this visit
  let products = null, tabs = null, dead = false;
  const ready = () => {
    if (dead || !products || !tabs) return;
    S.db = db; S.products = products; S.tabs = tabs;
    queueRender();
  };
  const lost = () => { dead = true; S.db = null; S.products = null; S.tabs = null; queueRender(); };
  db.collection("products").onSnapshot(snap => {
    products = new Map(snap.docs.map(d => [d.id, d.data()]));
    ready();
  }, lost);
  db.collection("tabs").onSnapshot(snap => {
    tabs = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.order || 0) - (b.order || 0));
    ready();
  }, lost);
  // portfolio: independent of the station's configuration; a dead subscription only empties the portfolio tab
  db.collection("transactions").onSnapshot(snap => { S.tx = new Map(snap.docs.map(d => [d.id, d.data()])); queueRender(); },
    () => { S.tx = false; queueRender(); });
  db.collection("pf").onSnapshot(snap => { S.pf = new Map(snap.docs.map(d => [d.id, d.data()])); queueRender(); },
    () => { S.pf = false; queueRender(); });
}

render();
loadMarket().then(queueRender);
loadAux("indices.json", "idx");
connectDb();
connectSample();
</script>
